<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DiskWise application icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2E4C"/>
      <stop offset="0.55" stop-color="#101B2E"/>
      <stop offset="1" stop-color="#080E18"/>
    </linearGradient>
    <linearGradient id="arc" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#1FA8E0"/>
      <stop offset="0.45" stop-color="#2DE2C5"/>
      <stop offset="1" stop-color="#66F2D8"/>
    </linearGradient>
    <linearGradient id="shard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24D"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E8F6FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- application tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>

  <!-- glow behind the platter -->
  <circle cx="256" cy="256" r="150" fill="#2DE2C5" opacity="0.10" filter="url(#soft)"/>

  <!-- disk platter: 270 degree arc, gap in the upper-right quadrant -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="url(#arc)" stroke-width="50"
          stroke-linecap="round" stroke-dasharray="603.19 201.06"/>

  <!-- inner data bars (analysis) -->
  <rect x="203" y="252" width="26" height="50" rx="13" fill="url(#bar)" opacity="0.92"/>
  <rect x="243" y="224" width="26" height="78" rx="13" fill="url(#bar)" opacity="0.96"/>
  <rect x="283" y="196" width="26" height="106" rx="13" fill="url(#bar)"/>

  <!-- reclaimed shard floating out of the gap -->
  <g transform="rotate(-12 347 165)">
    <rect x="319" y="137" width="56" height="56" rx="15" fill="url(#shard)"/>
    <rect x="333" y="151" width="28" height="7" rx="3.5" fill="#0B1424" opacity="0.35"/>
    <rect x="333" y="164" width="20" height="7" rx="3.5" fill="#0B1424" opacity="0.25"/>
  </g>
</svg>
