<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DiskWise icon, dark theme">
  <defs>
    <linearGradient id="arcD" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#1FA8E0"/>
      <stop offset="0.45" stop-color="#2DE2C5"/>
      <stop offset="1" stop-color="#7CF7DE"/>
    </linearGradient>
    <linearGradient id="shardD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24D"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <filter id="glowD" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <!-- transparent background version for dark UI surfaces -->
  <circle cx="256" cy="256" r="150" fill="#2DE2C5" opacity="0.16" filter="url(#glowD)"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="url(#arcD)" stroke-width="50"
          stroke-linecap="round" stroke-dasharray="603.19 201.06"/>
  <rect x="203" y="252" width="26" height="50" rx="13" fill="#F2FBFF" opacity="0.9"/>
  <rect x="243" y="224" width="26" height="78" rx="13" fill="#F2FBFF" opacity="0.95"/>
  <rect x="283" y="196" width="26" height="106" rx="13" fill="#FFFFFF"/>
  <g transform="rotate(-12 347 165)">
    <rect x="319" y="137" width="56" height="56" rx="15" fill="url(#shardD)"/>
    <rect x="333" y="151" width="28" height="7" rx="3.5" fill="#0B1424" opacity="0.35"/>
    <rect x="333" y="164" width="20" height="7" rx="3.5" fill="#0B1424" opacity="0.25"/>
  </g>
</svg>
